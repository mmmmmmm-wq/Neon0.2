name: Build Neon Floor APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project and build APK
        run: |
          if [ -d "NeonFloorAndroid" ]; then
            DIR="NeonFloorAndroid"
          elif [ -f "gradlew" ] || [ -f "build.gradle" ]; then
            DIR="."
          else
            echo "Android project files not found in repository root"
            ls -la
            exit 1
          fi
          if [ -f "$DIR/gradlew" ]; then
            chmod +x "$DIR/gradlew"
            (cd "$DIR" && ./gradlew assembleDebug --parallel)
          else
            gradle assembleDebug --parallel
          fi
          mkdir -p apk-out
          find . -name "app-debug.apk" -exec cp {} apk-out/app-debug.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk-out/app-debug.apk
